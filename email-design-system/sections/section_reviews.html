<!-- section-desc: Customer reviews as quote cards with star ratings. -->
<!--
  section_reviews.html  (root class="section-reviews")
  Reviews / social-proof block. Opt-in via brief §7 ("reviews").
  Eyebrow + headline + optional aggregate rating + 1-3 review quote cards.

  FACTS: review quotes, author names, star ratings, and the aggregate rating MUST
  come verbatim from product-brain/rules_social_proof.md. You may trim a quote
  without changing its meaning, but never reword it or invent a name/rating. Drop
  any card you don't have a real review for. Do not blend the 4.3/5 site rating
  with the Trustpilot figure.

  STYLE (rules_email_style_guide.md): cards #F5F5F5, 24px radius; quote 18px #333;
  author 14px bold #333; stars Halo Yellow #FCD62D; eyebrow 12px bold uppercase blue.
  No em dashes.

  Drop in as a middle row inside the 600px container table.
-->
<tr class="section-reviews">
  <td class="px-mobile" style="padding:12px 24px; font-family:'Inter',Arial,Helvetica,sans-serif;">
    <p style="margin:0 0 6px 0; font-size:12px; line-height:16px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#2f93f3;">[REVIEWS_EYEBROW]</p>
    <h2 style="margin:0 0 6px 0; font-size:24px; line-height:30px; font-weight:700; color:#333333;">[REVIEWS_HEADLINE]</h2>
    <p style="margin:0; font-size:14px; line-height:20px; color:#333333;"><span style="color:#fcd62d;">&#9733;</span> &nbsp;[REVIEWS_AGGREGATE]</p>

    <div style="font-size:1px; line-height:18px;">&nbsp;</div>

    <!-- review card 1 -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f5; border-radius:24px;">
      <tr>
        <td style="padding:24px 26px;">
          <p style="margin:0 0 10px 0; font-size:16px; line-height:16px; color:#fcd62d; letter-spacing:2px;">[REVIEW1_STARS]</p>
          <p style="margin:0 0 12px 0; font-size:18px; line-height:26px; color:#333333;">[REVIEW1_QUOTE]</p>
          <p style="margin:0; font-size:14px; line-height:20px; font-weight:700; color:#333333;">[REVIEW1_AUTHOR]</p>
        </td>
      </tr>
    </table>

    <div style="font-size:1px; line-height:12px;">&nbsp;</div>

    <!-- review card 2 (remove this card and the spacer above it if you only have one review) -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f5; border-radius:24px;">
      <tr>
        <td style="padding:24px 26px;">
          <p style="margin:0 0 10px 0; font-size:16px; line-height:16px; color:#fcd62d; letter-spacing:2px;">[REVIEW2_STARS]</p>
          <p style="margin:0 0 12px 0; font-size:18px; line-height:26px; color:#333333;">[REVIEW2_QUOTE]</p>
          <p style="margin:0; font-size:14px; line-height:20px; font-weight:700; color:#333333;">[REVIEW2_AUTHOR]</p>
        </td>
      </tr>
    </table>
  </td>
</tr>

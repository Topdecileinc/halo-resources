<!--
  section_footer.html
  Footer section: social icons row + legal/address line + unsubscribe.
  Always included in every email (you don't name it in brief §7; it's part of the frame).

  - Social icons: use the hosted icon URLs from rules_email_footer.md for the [SOCIAL_*] src values (reference copies: design-libraries/assets/social-icons/).
  - Legal line and unsubscribe text are STABLE boilerplate — pull the exact wording from
    rules_email_footer.md. The text below is a placeholder showing structure only.
  - Social links (href) are brand profile URLs; keep them current.
  - Fine-print style follows the style guide: small size, muted gray (#9D9D9D per the
    style guide; the sample used #888888 — defer to the style guide).

  Drop this in as the last rows inside the 600px container table.
-->

<!-- Social icons -->
<tr class="section-footer">
  <td align="center" style="padding:8px 0 16px 0;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center" style="padding:0 8px;">
          <a href="[FACEBOOK_URL]" target="_blank" style="text-decoration:none; border:0;">
            <img src="[SOCIAL_FACEBOOK]" width="32" height="32" alt="Facebook" style="display:block; border:0; outline:none; width:32px; height:32px;">
          </a>
        </td>
        <td align="center" style="padding:0 8px;">
          <a href="[INSTAGRAM_URL]" target="_blank" style="text-decoration:none; border:0;">
            <img src="[SOCIAL_INSTAGRAM]" width="32" height="32" alt="Instagram" style="display:block; border:0; outline:none; width:32px; height:32px;">
          </a>
        </td>
        <td align="center" style="padding:0 8px;">
          <a href="[TIKTOK_URL]" target="_blank" style="text-decoration:none; border:0;">
            <img src="[SOCIAL_TIKTOK]" width="32" height="32" alt="TikTok" style="display:block; border:0; outline:none; width:32px; height:32px;">
          </a>
        </td>
        <td align="center" style="padding:0 8px;">
          <a href="[YOUTUBE_URL]" target="_blank" style="text-decoration:none; border:0;">
            <img src="[SOCIAL_YOUTUBE]" width="32" height="32" alt="YouTube" style="display:block; border:0; outline:none; width:32px; height:32px;">
          </a>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- Address + unsubscribe (wording from rules_email_footer.md) -->
<tr>
  <td align="center" class="px-mobile" style="padding:8px 24px 32px 24px;">
    <p style="margin:0 0 8px 0; font-family: Arial, Helvetica, sans-serif; font-size:11px; line-height:16px; color:#9d9d9d; letter-spacing:0.5px;">
      [LEGAL_COMPANY_LINE]
    </p>
    <p style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size:11px; line-height:16px; color:#9d9d9d;">
      [UNSUBSCRIBE_TEXT] <a href="[UNSUBSCRIBE_URL]" target="_blank" class="footer-link" style="color:#9d9d9d; text-decoration:underline;">Unsubscribe</a>.
    </p>
  </td>
</tr>

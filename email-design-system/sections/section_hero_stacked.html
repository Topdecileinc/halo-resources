  is overlaid on a full-bleed photo.) Drop in as the first content row after section_header.

  No background-image overlay here, so it is bulletproof across clients with no VML needed —
  the text sits on a solid panel color and the photo is a normal <img> below it.

  DYNAMIC ([BRACKETED]): panel color, eyebrow, headline + its color, subhead, CTA label/URL/
  fill/text, and the photo (URL + alt). The CTA reuses the component_button.html pattern. The
  image defaults to placehold.co so nothing renders broken.

  STYLE (rules_email_style_guide.md): 24px corner radius (top on the panel, bottom on the image);
  CTA pill; body text #333. NOTE: the Figma source is a Memorial Day promo using a pink panel
  (#FFD7E6) and magenta (#F91A6B) for the headline + CTA. These read as CAMPAIGN-SPECIFIC colors,
  not brand tokens, so they are dynamic knobs here and are NOT added to the style guide. The
  Figma headline is 50px; this uses a 40px hero display size. The Figma eyebrow is a graphic
  badge; it is rendered here as a text eyebrow.
-->

<!--
  section_hero_overlay.html  (root class="section-hero-overlay")
  Hero block — the top content band of an email: a background image with an overlaid star
  rating, headline, subhead, and CTA button. Drop in as the first row after section_header,
  inside the 600px container table.

  RENDER (background-image + fallback): the text + CTA are overlaid on the hero image using the
  bulletproof VML/CSS pattern. Outlook replaces the photo with [HERO_BG_FALLBACK] (a light color)
  and keeps the dark text + CTA readable; every other client shows the photo. The exact cell
  height for the photo is client-sensitive — preview and tune the spacer / VML height.
  (See rules_email_build.md -> "Always flag rendering risks".)

  DYNAMIC ([BRACKETED]): hero image, stars, headline, subhead, CTA label/URL, the Outlook
  fallback color, and the CTA fill/text color. The CTA reuses the component_button.html pattern.
  Images default to placehold.co so nothing renders broken.

  STYLE (rules_email_style_guide.md): 24px card radius; stars Halo Yellow #FCD62D; text #333.
  CTA uses the style guide's Coral button variant (#FC5A41), added there for hero/photo CTAs
  (yellow remains the primary CTA). The headline uses a 48px hero display size at Regular (400)
  weight (Figma source: 60px Regular; style guide H1 is 34px Bold — kept large and regular to
  match the quote-style display intent). Stars are yellow per the style guide (the Figma star
  graphic is replaced with type; Figma image height 30px → font-size:28px / line-height:30px).
-->

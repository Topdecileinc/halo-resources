<!--
  section_hero_offer.html  (root class="section-hero-offer")
  Offer / promo hero: a dark panel with a discount badge, a large price-drop display (discount,
  sale price, struck-through original) and a CTA, above a full-width product image. Drop in as the
  first content row after section_header.

  Layout is stacked-like (panel + image below) but its panel is built around an OFFER module (not a
  headline/subhead), so it is its own control rather than a section_hero_stacked variant.

  RECONCILIATION FLAGS (Figma vs style guide):
   - The Figma "PRICE DROP" badge is a yellow PILL. The style guide forbids pill-shaped badges
     (pills are for CTAs only), so it is rendered here as bold uppercase Halo-Yellow TEXT, not a pill.
   - The offer/price is an IMAGE in Figma; per the build + style rules it is rendered as LIVE TEXT
     (struck-through original next to the bold sale price) — which is also what brief §5 fills.
   - Background is pure black (#000000); the style guide's dark background is #434343. Exposed as a
     dynamic [PANEL_BG] knob defaulting to the Figma black.

  DYNAMIC ([BRACKETED]): panel color, badge, discount/sale/original price, CTA label/URL/fill/text,
  and the product image (URL + alt). The CTA reuses component_button.html (Yellow variant). The image
  defaults to placehold.co. The offer values normally come from brief §5.

  STYLE (rules_email_style_guide.md): 24px radius; on a dark bg the eyebrow is Halo Yellow, the offer
  text is white, and the CTA is the Yellow pill (#FCD62D fill / #333 text). Bound Figma vars confirm
  --halo-yellow #FCD62D and --text #333.
-->

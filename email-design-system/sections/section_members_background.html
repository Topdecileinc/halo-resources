<!-- section-desc: Members background — 600×600 square card with a background photo, headline, body text, and CTA button overlaid in the upper-left. -->
<!--
  section_members_background.html  (root class="section-members-background")
  A square image card: a full-bleed background photo with a bold headline, body text,
  and a CTA button overlaid in the top-left. The photo fills the lower portion.
  Drop inside the 600px container table, e.g. after section_header.

  RENDER (background-image + fallback): text is overlaid via the bulletproof VML/CSS
  pattern. Outlook replaces the photo with [BG_FALLBACK] (a light color) and shows the
  dark text on that background. The photo height is client-sensitive; tune the spacer
  if needed. (See rules_email_build.md → "Always flag rendering risks".)

  DYNAMIC ([BRACKETED]): background image URL, Outlook fallback color, headline, body text,
  CTA label, CTA URL, CTA fill color, CTA text color.
  Images default to placehold.co so nothing renders broken.

  STYLE (rules_email_style_guide.md): 24px card radius; text color #333333 (--text).
  Headline: Inter Bold 36px (Figma spec; style-guide H1 is 34px Bold — kept at 36px per
  the Figma source). Body: Inter Regular 18px / 22px line-height.
  Button: Yellow pill (#FCD62D fill, #333333 text) per component_button.html.
-->

  <td align="center" style="padding:0;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:100%;">
      <tr>
        <td background="[IMG_BG_URL]" bgcolor="[BG_FALLBACK]" valign="top" style="background-color:[BG_FALLBACK]; background-image:url('[IMG_BG_URL]'); background-position:center top; background-repeat:no-repeat; background-size:cover; border-radius:24px; font-family:'Inter',Arial,Helvetica,sans-serif;">
          <!--[if gte mso 9]>
          <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px;height:600px;">

            <v:textbox inset="0,0,0,0">
          <![endif]-->
          <div>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" valign="top" style="padding:30px 30px 15px 30px;">
                  <h2 style="margin:0; font-family:'Inter',Arial,Helvetica,sans-serif; font-size:36px; line-height:44px; font-weight:700; color:#333333;">[HEADLINE]</h2>
                </td>
              </tr>
              <tr>
                <td align="left" valign="top" style="padding:0 200px 0 30px;">
                  <p style="margin:0; font-family:'Inter',Arial,Helvetica,sans-serif; font-size:18px; line-height:22px; font-weight:400; color:#333333;">[BODY_TEXT]</p>
                </td>
              </tr>
              <tr>
                <td align="left" valign="top" style="padding:15px 30px 0 30px;">
                  <table class="component-button" role="presentation" cellpadding="0" cellspacing="0" border="0" align="left">
                    <tr>
                      <td align="center" style="border-radius:999px; background-color:[CTA_FILL];">
                        <!--[if mso]>
                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="[CTA_URL]" style="height:52px;v-text-anchor:middle;width:167px;" arcsize="100%" stroke="f" fillcolor="[CTA_FILL]">
                          <w:anchorlock/>

                        <!--[if !mso]><!-- -->

                        <!--<![endif]-->
                      </td>

          </div>

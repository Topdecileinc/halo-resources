<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================================
     Halo Email Resources — default page layout
     Header + (back button + page TOC) on left + content on right.
     ============================================================================ */

  :root {
    --halo-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
    --halo-font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

    --halo-blue-950: #071826;
    --halo-blue-50: #f5f9fc;
    --halo-ink: var(--halo-blue-950);
    --halo-gray-700: #354c5c;
    --halo-gray-600: #526777;
    --halo-gray-500: #738391;
    --halo-gray-400: #a7b3bd;
    --halo-gray-300: #d3dce3;
    --halo-gray-200: #e2e9ee;
    --halo-gray-100: #f2f6f8;
    --halo-gray-50: #fbfcfd;
    --halo-white: #ffffff;
    --halo-yellow: #fcd62d;
    --halo-yellow-soft: #fff8d6;
    --halo-blue: #2f93f3;

    --halo-radius-sm: 6px;
    --halo-radius-md: 8px;
    --halo-radius-lg: 12px;
    --halo-radius-pill: 999px;

    --halo-duration-fast: 140ms;
    --halo-ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --nav-width: 260px;
    --content-max: 760px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; scroll-padding-top: 88px; }
  body {
    margin: 0;
    background: var(--halo-white);
    color: var(--halo-ink);
    font-family: var(--halo-font-sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  a { color: var(--halo-blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* --- Top header --- */
  .halo-header {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--halo-gray-200);
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
  }
  .halo-header__inner {
    width: min(1280px, calc(100% - 32px));
    margin-inline: auto;
    min-height: 64px;
    display: flex; justify-content: space-between; align-items: center; gap: 24px;
  }
  .halo-header__logo img { width: 96px; height: auto; display: block; }
  .halo-header__tag {
    color: var(--halo-gray-600);
    font-size: 0.9375rem; font-weight: 800; letter-spacing: 0.04em;
  }

  /* --- Page shell: sidebar + content --- */
  .halo-page {
    width: min(1280px, calc(100% - 32px));
    margin-inline: auto;
    display: grid;
    grid-template-columns: var(--nav-width) minmax(0, 1fr);
    gap: 48px;
    padding-top: 32px;
    padding-bottom: 96px;
  }

  /* --- Left sidebar (back button + TOC) --- */
  .halo-sidebar {
    position: sticky;
    top: 88px;
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding-right: 8px;
  }

  /* Back button — pill-shaped, prominent enough to stand out from the TOC */
  .halo-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 10px 14px;
    border-radius: var(--halo-radius-pill);
    background: var(--halo-gray-100);
    color: var(--halo-ink);
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 32px;
    transition:
      background var(--halo-duration-fast) var(--halo-ease-out),
      transform var(--halo-duration-fast) var(--halo-ease-out);
  }
  .halo-back:hover {
    background: var(--halo-gray-200);
    text-decoration: none;
    color: var(--halo-ink);
  }
  .halo-back:hover .halo-back__arrow {
    transform: translateX(-2px);
  }
  .halo-back__arrow {
    display: inline-block;
    font-size: 1rem;
    line-height: 1;
    transition: transform var(--halo-duration-fast) var(--halo-ease-out);
  }

  /* TOC */
  .halo-toc__label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--halo-gray-600);
    margin: 0 0 12px 0;
  }
  .halo-toc {
    list-style: none;
    margin: 0;
    padding: 0;
    border-left: 1px solid var(--halo-gray-200);
  }
  .halo-toc li { margin: 0; }
  .halo-toc a {
    display: block;
    padding: 6px 12px;
    margin-left: -1px;
    border-left: 2px solid transparent;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--halo-gray-600);
    line-height: 1.4;
    transition:
      color var(--halo-duration-fast) var(--halo-ease-out),
      border-color var(--halo-duration-fast) var(--halo-ease-out);
  }
  .halo-toc a:hover {
    color: var(--halo-ink);
    text-decoration: none;
  }
  .halo-toc a.active {
    color: var(--halo-ink);
    font-weight: 650;
    border-left-color: var(--halo-yellow);
  }
  /* H3 entries indented under their parent H2 */
  .halo-toc .toc-h3 a {
    padding-left: 28px;
    font-size: 0.8125rem;
    font-weight: 400;
  }
  .halo-toc__empty {
    color: var(--halo-gray-500);
    font-size: 0.8125rem;
    font-style: italic;
    padding: 6px 12px;
  }

  /* --- Right content area --- */
  .halo-content {
    max-width: var(--content-max);
    min-width: 0;
  }
  .halo-content > .eyebrow {
    font-size: 0.75rem; font-weight: 800;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--halo-gray-600);
    margin: 0 0 12px 0;
  }

  /* --- Typography for rendered markdown --- */
  .halo-content h1 {
    font-size: clamp(2.25rem, 5vw, 3rem);
    font-weight: 650; line-height: 1.05; letter-spacing: -0.01em;
    margin: 0 0 16px 0;
    text-wrap: balance;
  }
  .halo-content h1 + p { font-size: 1.0625rem; color: var(--halo-gray-700); margin-top: 0; }
  .halo-content h2 {
    font-size: 1.625rem; font-weight: 650; line-height: 1.2;
    margin: 56px 0 16px 0;
    padding-top: 28px;
    border-top: 1px solid var(--halo-gray-200);
    scroll-margin-top: 88px;
  }
  .halo-content h2:first-of-type { border-top: 0; padding-top: 0; margin-top: 40px; }
  .halo-content h3 {
    font-size: 1.25rem; font-weight: 650; line-height: 1.3;
    margin: 36px 0 12px 0;
    scroll-margin-top: 88px;
  }
  .halo-content h4 {
    font-size: 1.0625rem; font-weight: 650;
    margin: 24px 0 8px 0;
    color: var(--halo-gray-700);
  }
  .halo-content p, .halo-content li { font-size: 1rem; line-height: 1.65; }
  .halo-content p { margin: 0 0 16px 0; }
  .halo-content ul, .halo-content ol { margin: 0 0 16px 0; padding-left: 24px; }
  .halo-content li { margin: 6px 0; }
  .halo-content strong { font-weight: 650; color: var(--halo-ink); }
  .halo-content em { font-style: italic; }
  .halo-content hr { border: 0; border-top: 1px solid var(--halo-gray-200); margin: 40px 0; }

  /* --- Blockquotes (callouts) --- */
  .halo-content blockquote {
    margin: 20px 0;
    padding: 16px 20px;
    border-left: 3px solid var(--halo-yellow);
    background: var(--halo-yellow-soft);
    border-radius: 0 var(--halo-radius-md) var(--halo-radius-md) 0;
    color: var(--halo-ink);
  }
  .halo-content blockquote > p:last-child { margin-bottom: 0; }
  .halo-content blockquote strong:first-child { color: var(--halo-ink); }

  /* --- Inline code + code blocks --- */
  .halo-content code {
    font-family: var(--halo-font-mono);
    font-size: 0.875em;
    padding: 0.15em 0.4em;
    background: var(--halo-gray-100);
    border-radius: 4px;
    color: var(--halo-ink);
  }
  .halo-content pre {
    margin: 20px 0;
    padding: 16px 20px;
    background: var(--halo-ink);
    color: #e8eef3;
    border-radius: var(--halo-radius-md);
    overflow-x: auto;
    font-size: 0.875rem;
    line-height: 1.55;
  }
  .halo-content pre code {
    background: transparent;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }

  /* --- Tables --- */
  .halo-content table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin: 20px 0;
    font-size: 0.9375rem;
    border: 1px solid var(--halo-gray-200);
    border-radius: var(--halo-radius-md);
    overflow: hidden;
  }
  .halo-content th, .halo-content td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--halo-gray-200);
  }
  .halo-content tr:last-child td { border-bottom: 0; }
  .halo-content th {
    background: var(--halo-gray-50);
    font-weight: 650;
    color: var(--halo-gray-700);
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .halo-content td code { font-size: 0.8125rem; }

  .halo-content img {
    max-width: 100%;
    height: auto;
    border-radius: var(--halo-radius-md);
    margin: 16px 0;
  }

  /* --- Mobile --- */
  @media (max-width: 900px) {
    .halo-page {
      grid-template-columns: 1fr;
      gap: 24px;
      padding-top: 24px;
    }
    .halo-sidebar {
      position: static;
      max-height: none;
      padding: 16px;
      background: var(--halo-gray-50);
      border-radius: var(--halo-radius-md);
    }
    .halo-back { margin-bottom: 20px; }
  }
  @media (max-width: 560px) {
    .halo-header__inner { width: calc(100% - 24px); }
    .halo-page { width: calc(100% - 24px); padding-bottom: 64px; }
    .halo-content h1 { font-size: 2rem; }
    .halo-content h2 { font-size: 1.375rem; margin-top: 40px; }
    .halo-content pre { padding: 12px 14px; font-size: 0.8125rem; }
  }
</style>
</head>
<body>

<header class="halo-header">
  <div class="halo-header__inner">
    <a href="{{ '/' | relative_url }}" class="halo-header__logo" aria-label="Halo Email Resources home">
      <img src="{{ '/email-design-system/assets/shared-images/halo-logo-dark.svg' | relative_url }}" alt="Halo">
    </a>
    <span class="halo-header__tag">Email Resources</span>
  </div>
</header>

<div class="halo-page">
  <aside class="halo-sidebar">
    <a class="halo-back" href="{{ '/' | relative_url }}">
      <span class="halo-back__arrow" aria-hidden="true">←</span>
      All resources
    </a>

    <p class="halo-toc__label">On this page</p>
    <ul class="halo-toc" id="halo-toc">
      <!-- populated by JavaScript on load -->
    </ul>
  </aside>

  <main class="halo-content" id="halo-content">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    {{ content }}
  </main>
</div>

<script>
(function () {
  // ---------- TOC builder ----------
  // Walks the rendered content, finds every H2 and H3, injects anchor IDs
  // (slugified from the heading text), and builds the sidebar TOC list.
  function slugify(text) {
    return text
      .toLowerCase()
      .trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/[\s_-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function buildTOC() {
    var content = document.getElementById('halo-content');
    var toc = document.getElementById('halo-toc');
    if (!content || !toc) return [];

    var headings = content.querySelectorAll('h2, h3');
    if (!headings.length) {
      toc.innerHTML = '<li class="halo-toc__empty">No sections</li>';
      return [];
    }

    var entries = [];
    var usedSlugs = {};

    headings.forEach(function (h) {
      var text = h.textContent.trim();
      var slug = slugify(text);
      // Deduplicate slugs in case two headings have the same text
      if (usedSlugs[slug]) {
        usedSlugs[slug] += 1;
        slug = slug + '-' + usedSlugs[slug];
      } else {
        usedSlugs[slug] = 1;
      }
      // Don't overwrite an existing id (kramdown may have added one)
      if (!h.id) h.id = slug;

      var li = document.createElement('li');
      if (h.tagName.toLowerCase() === 'h3') li.className = 'toc-h3';
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = text;
      li.appendChild(a);
      toc.appendChild(li);

      entries.push({ id: h.id, heading: h, link: a });
    });

    return entries;
  }

  // ---------- Scroll-spy ----------
  // Highlights the TOC entry whose heading is closest to the top of the viewport.
  function setupScrollSpy(entries) {
    if (!entries.length || !('IntersectionObserver' in window)) return;

    // Track which headings are currently "visible" (above some threshold line)
    var visible = new Map();

    var observer = new IntersectionObserver(function (changes) {
      changes.forEach(function (change) {
        if (change.isIntersecting) {
          visible.set(change.target, change.intersectionRatio);
        } else {
          visible.delete(change.target);
        }
      });
      updateActive();
    }, {
      // Trigger when heading enters/leaves the top ~30% of the viewport
      rootMargin: '-80px 0px -70% 0px',
      threshold: 0
    });

    entries.forEach(function (e) { observer.observe(e.heading); });

    function updateActive() {
      // Clear all
      entries.forEach(function (e) { e.link.classList.remove('active'); });

      if (visible.size === 0) {
        // Nothing in the trigger zone — find the closest one above viewport instead
        var aboveTop = entries.filter(function (e) {
          return e.heading.getBoundingClientRect().top < 100;
        });
        if (aboveTop.length) {
          aboveTop[aboveTop.length - 1].link.classList.add('active');
        } else if (entries[0]) {
          // Before any heading — highlight the first
          entries[0].link.classList.add('active');
        }
        return;
      }

      // Pick the topmost visible heading
      var topMost = null;
      var topY = Infinity;
      visible.forEach(function (_, heading) {
        var y = heading.getBoundingClientRect().top;
        if (y < topY) {
          topY = y;
          topMost = heading;
        }
      });
      if (topMost) {
        var entry = entries.find(function (e) { return e.heading === topMost; });
        if (entry) entry.link.classList.add('active');
      }
    }

    // Initial highlight
    updateActive();
  }

  // Run on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      var entries = buildTOC();
      setupScrollSpy(entries);
    });
  } else {
    var entries = buildTOC();
    setupScrollSpy(entries);
  }
})();
</script>

</body>
</html>

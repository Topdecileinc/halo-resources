title: Halo Email Resources
description: Halo's email-building engine — resources, rules, and validation.
url: https://topdecileinc.github.io
baseurl: /halo-resources

# Apply the default layout to every markdown file automatically.
# No need to add `layout: default` to each file's front matter.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Exclude code, archives, and the test folder from being published as pages.
exclude:
  - test/
  - "*.zip"
  - "*.py"
  - "*.pyc"
  - "__pycache__"
  - ".gitignore"
  # PHP form + pipeline are hosted on a PHP-capable server, not GitHub Pages.
  # Don't publish them (Pages would serve PHP as raw text).
  - brief/form.php
  - brief/lib
  - brief/config.sample.php
  - submissions/
  - generated/

# Tell Jekyll to also process README files into pages.
include:
  - README.md

# Enable kramdown features for nicer markdown rendering.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

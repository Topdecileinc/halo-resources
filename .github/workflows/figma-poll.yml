# Figma → email block POLLER. The TRIGGER (Figma won't deliver webhooks on a Professional
# plan, so we read on a schedule instead).
#
# Every 20 minutes (and on demand) poll.py reads the Figma file and looks at every node marked
# "Ready for dev". A ready node that isn't tracked yet is ONBOARDED (a new block is created); a
# ready node already tracked is REBUILT only if its design changed. Nothing that isn't marked
# Ready for dev is ever touched. Each block to build is handed to figma-build.yml.
#
# Needs the same secrets as figma-build.yml: FIGMA_CLIENT_ID / FIGMA_CLIENT_SECRET /
# FIGMA_REFRESH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN (the build call inherits them).
# Full docs: figma-pipeline/GUIDE.md.

name: figma-poll

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes
  workflow_dispatch:           # manual "poll now" button
    inputs:
      onboard_cap:
        description: "Max NEW frames to onboard this run (0 = onboard none; changed existing blocks still rebuild)"
        required: false
        default: "10"
      delete_cap:
        description: "Max blocks to DELETE this run (0 = preview only: list what would be deleted, delete nothing)"
        required: false
        default: "0"

permissions:
  contents: write              # to commit poll_state.json (and the build commits the block)
  id-token: write              # the called figma-build uses OIDC; a caller can't grant less

concurrency:                   # never run two polls at once
  group: figma-poll
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      any:     ${{ steps.poll.outputs.any }}
    env:
      FIGMA_FILE_KEY:      ${{ vars.FIGMA_FILE_KEY }}     # which Figma file to track (a VARIABLE)
      FIGMA_CLIENT_ID:     ${{ secrets.FIGMA_CLIENT_ID }}
      FIGMA_CLIENT_SECRET: ${{ secrets.FIGMA_CLIENT_SECRET }}
      FIGMA_REFRESH_TOKEN: ${{ secrets.FIGMA_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Detect changed + new blocks
        id: poll
        env:
          ONBOARD_CAP: ${{ github.event.inputs.onboard_cap || '10' }}
          # Deletion starts PREVIEW-ONLY (0): scheduled runs won't delete until this default is
          # raised to e.g. 10. Lets the team confirm the library state before auto-delete goes live.
          DELETE_CAP:  ${{ github.event.inputs.delete_cap  || '0' }}
        run: python3 figma-pipeline/poll.py

      # poll.py may have DELETED block + playground files (nodes no longer Ready for dev).
      # Reflect that in the manifest and index, then commit state + deletions together.
      - name: Reconcile manifest + index, then commit (state, deletions)
        run: |
          python3 figma-pipeline/generate_manifest.py
          python3 figma-pipeline/generate_index.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "figma-pipeline[bot]"
            git config user.email "figma-pipeline@users.noreply.github.com"
            git add -A
            git commit -m "figma-poll: sync change-detection state + remove unmarked blocks"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              echo "push rejected, retrying (${attempt}/3)..."
            done
          else
            echo "No state/deletion changes."
          fi

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      matrix:
        target: ${{ fromJson(needs.detect.outputs.changed) }}
    uses: ./.github/workflows/figma-build.yml
    with:
      file_key:    ${{ matrix.target.file_key }}
      node_id:     ${{ matrix.target.node_id }}
      output_path: ${{ matrix.target.output_path }}
    secrets: inherit

# Figma → email block BUILDER. The worker that builds ONE block.
#
# Called by the poller (figma-poll.yml, via workflow_call) once per block to (re)build, and
# also runnable on its own: the "Run workflow" button (workflow_dispatch) or an external
# repository_dispatch. Pulls one Figma node via REST, translates it to an email block with
# Claude Code (create-from-scratch or refresh), runs the validation gate, and commits ONLY if
# the gate passes. Thin wrapper here (GitHub requires workflows under .github/workflows/); the
# real logic is in figma-pipeline/. Full docs: figma-pipeline/GUIDE.md.
#
# Required repo Actions secrets: CLAUDE_CODE_OAUTH_TOKEN, FIGMA_CLIENT_ID, FIGMA_CLIENT_SECRET,
# FIGMA_REFRESH_TOKEN.  (See GUIDE.md "Secrets & tokens" for how to obtain each.)

name: figma-build

on:
  repository_dispatch:
    types: [figma-publish]
  workflow_dispatch:        # manual trigger for smoke-testing
    inputs:
      file_key:    { description: "Figma file key", required: true }
      node_id:     { description: "Figma node id (e.g. 4618:108)", required: true }
      output_path: { description: "Block file to (re)generate", required: true }
  workflow_call:            # called by figma-poll.yml, once per changed block
    inputs:
      file_key:    { type: string, required: true }
      node_id:     { type: string, required: true }
      output_path: { type: string, required: true }

permissions:
  contents: write           # to commit the regenerated block
  id-token: write           # claude-code-action uses OIDC to auth

concurrency:                # don't let two rebuilds race the same refresh-token/commit
  group: figma-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIGMA_CLIENT_ID:     ${{ secrets.FIGMA_CLIENT_ID }}
      FIGMA_CLIENT_SECRET: ${{ secrets.FIGMA_CLIENT_SECRET }}
      FIGMA_REFRESH_TOKEN: ${{ secrets.FIGMA_REFRESH_TOKEN }}
      # inputs.* covers workflow_dispatch AND workflow_call; client_payload covers repository_dispatch
      FILE_KEY:    ${{ inputs.file_key    || github.event.client_payload.file_key }}
      NODE_ID:     ${{ inputs.node_id     || github.event.client_payload.node_id }}
      OUTPUT_PATH: ${{ inputs.output_path || github.event.client_payload.output_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Pull the node from Figma (REST, headless)
        run: python3 figma-pipeline/figma_fetch.py --file "$FILE_KEY" --node "$NODE_ID" --out ./_figma_in

      # Use the official action: raw `claude -p` ignores ANTHROPIC_API_KEY in headless CI
      # (a known issue) and fails with "Not logged in". The action reads the key as a param.
      - name: Translate to an email block (Claude Code action)
        id: translate
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's built-in token so the action skips the OIDC->GitHub-App
          # exchange (which needs the Claude GitHub App installed on the repo).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >-
            Build the email block at
            ${{ inputs.output_path || github.event.client_payload.output_path }}
            from the Figma design in ./_figma_in/node.json and ./_figma_in/node.png. Follow
            developer-skills/rules_figma_download.md exactly: translate to email-safe table HTML
            and keep [BRACKETED] placeholders for dynamic content. IF the file already exists,
            refresh it preserving hand edits per the Refresh section. IF it does NOT exist yet,
            CREATE it from scratch per the doc: classify it, write the section/component HTML,
            add the figma-source comment (file/node/url/kind/fetched + a real generated-sha), and
            generate its matching playground under email-design-system/playground/. Either way,
            recompute the generated-sha and write ONLY that block and its playground — change
            nothing else. Do NOT run git or commit; a later step validates and commits.
          claude_args: |
            --allowedTools "Read,Edit,Write,Bash(python3 *)"
            --max-turns 40

      # The action can exit 0 even when Claude failed (e.g. an auth error returns
      # is_error:true but a "success" subtype). Without this, a broken token would
      # silently produce a green "no changes" run. Fail loudly instead.
      - name: Fail if Claude errored
        env:
          EXECUTION_FILE: ${{ steps.translate.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = os.environ.get("EXECUTION_FILE", "")
          if not path or not os.path.isfile(path):
              sys.exit("::error::No Claude execution file at %r — cannot confirm success." % path)
          raw = open(path).read().strip()
          # The file may be a JSON array OR concatenated/JSONL objects — handle both.
          events = []
          try:
              obj = json.loads(raw)
              events = obj if isinstance(obj, list) else [obj]
          except json.JSONDecodeError:
              dec, i, n = json.JSONDecoder(), 0, len(raw)
              while i < n:
                  while i < n and raw[i].isspace():
                      i += 1
                  if i >= n:
                      break
                  o, i = dec.raw_decode(raw, i)
                  events.append(o)
          results = [e for e in events if isinstance(e, dict) and e.get("type") == "result"]
          if not results:
              sys.exit("::error::No result event in Claude output — treating as failure.")
          r = results[-1]
          if r.get("is_error") or r.get("api_error_status"):
              sys.exit("::error::Claude failed: %s" % r.get("result", "(no message)"))
          print("Claude step succeeded (%s turns)." % r.get("num_turns", "?"))
          PY

      - name: Regenerate the manifest
        run: python3 figma-pipeline/generate_manifest.py

      - name: Validation gate (blocks the commit on failure)
        run: python3 figma-pipeline/validate_block.py "$OUTPUT_PATH"

      - name: Commit on green
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "figma-pipeline[bot]"
            git config user.email "figma-pipeline@users.noreply.github.com"
            git add -A
            git commit -m "figma: rebuild ${OUTPUT_PATH} from node ${NODE_ID}"
            # main can advance during the ~6-min build (another publish, a human commit).
            # Rebase our single block commit onto the latest main, then push — with a few
            # retries in case it moves again between the rebase and the push.
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Pushed on attempt ${attempt}."; exit 0
              fi
              echo "Push rejected (main moved); retrying (${attempt}/3)..."
            done
            echo "::error::Could not push after 3 rebase attempts."; exit 1
          else
            echo "No changes — nothing to commit."
          fi

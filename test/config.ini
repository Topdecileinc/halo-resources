# validate.py configuration
# All paths are resolved relative to this file's directory (test/), not your shell's cwd.
# That way the script runs the same whether you call it from the repo root or inside test/.

[paths]
# Root of the resources repo, relative to this config. Default assumes test/ is one
# level inside the repo. Override if the test harness lives somewhere else.
repo_root = ..

# Where the email packages live. Each campaign is a subfolder containing exactly
# one .html file, one .json file, and one .md file (any filenames — found by
# extension). More or fewer of any type fails the campaign.
emails_dir = ./emails

# Where the rule files (rules_*.md) live, relative to repo_root. Rules are split
# across the layered folders, so this is a comma-separated list; for each rule
# file the validator searches these dirs in order and uses the first match.
# (A legacy single-value `rules_dir` is still honored if `rules_dirs` is absent.)
rules_dirs = brand-brain, product-brain, email-design-system, braze-deployment

# Where sections and components live, relative to repo_root. The block-fidelity
# validator scans these to know what to verify rendered emails against.
sections_dir = email-design-system/sections
components_dir = email-design-system/components

[behavior]
# If true, stop at the first campaign that fails (exit 1 immediately).
# If false (default), run all campaigns and report a summary at the end.
fail_fast = false

# If true (default), print every [OK] line in the per-campaign output so you can
# see exactly what was checked. If false, only print warnings/errors and counts.
# Redirect to a file (python3 validate.py > report.txt) if the output is too long.
verbose_passed = true

# If true (default), validator modules that can't parse their source rule file
# (e.g. malformed Colors table in the style guide) emit ERRORS, not warnings.
# Set false to allow degraded runs on partial setups.
strict_rule_parsing = true

[w3c]
# W3C HTML conformance check. Disabled by default because email HTML
# deliberately violates HTML5 strict standards (Outlook-specific markup,
# table attributes, etc.), so the value-to-noise ratio is low. Turn it on
# if you want extra rigor.
enabled = false

# When W3C is enabled, the script can validate three ways (tried in this order):
#   1. W3C's web service at validator.w3.org/nu (default — no install needed,
#      just an internet connection; ~1-2 sec per email).
#   2. A local `vnu.jar` if you set vnu_jar_path below (needs Java).
#   3. `html5validator` on PATH (needs Java + `pip install html5validator`).
#
# The web service is the simplest path; set use_web_service = false only if
# you're working offline or don't want HTML sent to W3C's servers.
use_web_service = true
vnu_jar_path =
